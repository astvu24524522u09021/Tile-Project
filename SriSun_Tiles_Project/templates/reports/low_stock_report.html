{% extends 'base.html' %}

{% block title %}Low Stock Report{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-body p-4">
        <h2 class="fw-bold mb-3">Low Stock Report</h2>
        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Tile</th>
                    <th>Godown</th>
                    <th>Quantity</th>
                </tr>
            </thead>
            <tbody>
                {% for item in data %}
                    <tr>
                        <td>{{ item.tile.name }}</td>
                        <td>{{ item.godown.name }}</td>
                        <td>{{ item.quantity }}</td>
                    </tr>
                {% empty %}
                    <tr><td colspan="3">No low-stock items found.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
