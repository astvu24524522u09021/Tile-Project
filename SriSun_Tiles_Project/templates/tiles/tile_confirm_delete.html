{% extends 'base.html' %}

{% block title %}Delete Tile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">Delete Tile</h3>
                <p>Are you sure you want to delete this tile?</p>
                <p><strong>{{ tile.model_id }}: {{ tile.name }}</strong></p>
                {% if tile.image %}<img src="{{ tile.image.url }}" alt="{{ tile.name }}" class="tile-detail-image mb-3">{% endif %}
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Confirm Delete</button>
                    <a href="{% url 'admin_product_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
